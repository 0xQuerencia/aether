# Optional audio-reactive displays; run only while a visualiser is visible.
[general]
bars = 24
framerate = 48
autosens = 1

[input]
method = pulse
source = auto

[output]
method = raw
channels = mono
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
